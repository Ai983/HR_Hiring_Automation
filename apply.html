<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom is deliberately ALLOWED. Candidates read this on their own
         phones and some will want to zoom; inputs are 16px so iOS never
         auto-zooms on focus anyway. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <!-- The link is shared directly with candidates, not advertised. Keeping
         it out of search results stops stale openings surfacing on Google
         long after the role is filled. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Candidate Application — Hagerstone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="apply-root"></div>
    <script type="module" src="/src/apply-main.jsx"></script>
  </body>
</html>
